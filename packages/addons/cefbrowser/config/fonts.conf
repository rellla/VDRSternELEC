<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font configuration of the cefbrowser addon for VDR*ELEC.
  The bundled fontconfig of libcef doesn't understand the system configuration.
-->
<fontconfig>
    <dir>/usr/share/fonts</dir>
    <dir>/storage/.fonts</dir>

    <cachedir>/storage/.cache/fontconfig</cachedir>

    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>Tiresias</family>
            <family>DejaVu Sans</family>
            <family>Liberation Sans</family>
            <family>Roboto</family>
            <family>Noto Sans</family>
        </prefer>
    </alias>

    <alias>
        <family>serif</family>
        <prefer>
            <family>DejaVu Serif</family>
            <family>Liberation Serif</family>
            <family>Noto Serif</family>
        </prefer>
    </alias>

    <alias>
        <family>monospace</family>
        <prefer>
            <family>DejaVu Sans Mono</family>
            <family>Liberation Mono</family>
            <family>Noto Sans Mono</family>
        </prefer>
    </alias>
</fontconfig>
